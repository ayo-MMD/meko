name: meko
description: "Meko - Vehicle telemetry, diagnostic scanning, and real-time sensor monitoring via OBD2/BLE"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Core dependencies per SKILL.md ---
  supabase_flutter: ^2.9.0        # Auth (Magic Link) & database ops
  flutter_blue_plus: ^1.32.0      # Exclusive BLE communication engine
  flutter_dotenv: ^5.2.1          # Secure .env variable management
  http: ^1.4.0                    # External webhook dispatches (Make.com)
  permission_handler: ^11.4.0     # Runtime BLE/location permissions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/mockups/
